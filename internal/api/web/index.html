<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tessera</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>

<!-- Вход. Показывается, пока сервер не признал куку. -->
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm">
    <span class="brand" style="margin-bottom:18px">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="0" y="0" width="8.5" height="8.5" rx="2.2" fill="currentColor"/>
        <rect x="11.5" y="0" width="8.5" height="8.5" rx="2.2" fill="currentColor" opacity=".3"/>
        <rect x="0" y="11.5" width="8.5" height="8.5" rx="2.2" fill="currentColor" opacity=".3"/>
        <rect x="11.5" y="11.5" width="8.5" height="8.5" rx="2.2" fill="currentColor"/>
      </svg>
      Tessera
    </span>
    <label class="lbl" for="pass">Пароль</label>
    <input id="pass" type="password" autocomplete="current-password" autofocus>
    <button class="btn" type="submit">Войти</button>
    <p class="gate-note" id="gateNote"></p>
  </form>
</div>

<!-- Панель. -->
<div class="wrap" id="root" hidden>
  <header class="topbar">
    <span class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="0" y="0" width="8.5" height="8.5" rx="2.2" fill="currentColor"/>
        <rect x="11.5" y="0" width="8.5" height="8.5" rx="2.2" fill="currentColor" opacity=".3"/>
        <rect x="0" y="11.5" width="8.5" height="8.5" rx="2.2" fill="currentColor" opacity=".3"/>
        <rect x="11.5" y="11.5" width="8.5" height="8.5" rx="2.2" fill="currentColor"/>
      </svg>
      Tessera
    </span>
    <div class="appsel">
      <span class="dot" id="appdot"></span>
      <select id="appselect" aria-label="Приложение"></select>
    </div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Период" id="ranges">
      <button data-range="7d">7 дней</button>
      <button data-range="15d" aria-pressed="true">15 дней</button>
      <button data-range="30d">30 дней</button>
      <button data-range="all">Всё время</button>
    </div>
    <div class="seg seg-icons" role="group" aria-label="Тема">
      <button data-theme-set="auto" aria-pressed="true" title="Как в системе" aria-label="Как в системе">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6"/>
          <path d="M8 2a6 6 0 0 1 0 12z" class="solid"/>
        </svg>
      </button>
      <button data-theme-set="light" title="Светлая" aria-label="Светлая">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3.1"/>
          <path d="M8 .9v2.2M8 12.9v2.2M.9 8h2.2M12.9 8h2.2M3 3l1.6 1.6M11.4 11.4 13 13M13 3l-1.6 1.6M4.6 11.4 3 13"/>
        </svg>
      </button>
      <button data-theme-set="dark" title="Тёмная" aria-label="Тёмная">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6 5.8 5.8 0 1 0 13.4 9.6Z"/>
        </svg>
      </button>
    </div>
    <button class="ghost-btn" id="refresh" title="Пересобрать данные">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M14 8a6 6 0 1 1-1.8-4.3"/><path d="M14 1.6V4.4H11.2"/>
      </svg>
      <span class="lbl-btn">Обновить</span>
    </button>
    <button class="ghost-btn" id="signout" title="Выйти">Выйти</button>
  </header>

  <div class="context">
    <div class="ctx-cell"><span class="lbl">Сбор</span><span class="ctx-v" id="ctx-range">—</span></div>
    <div class="ctx-cell"><span class="lbl">На связи</span><span class="ctx-v num" id="ctx-online" title="Живые соединения приложения">—</span></div>
    <div class="ctx-cell"><span class="lbl">Люди</span><span class="ctx-v num" id="ctx-people">—</span></div>
    <div class="ctx-cell"><span class="lbl">События</span><span class="ctx-v num" id="ctx-events">—</span></div>
    <div class="ctx-cell"><span class="lbl">Версия SDK</span><span class="ctx-v mono" id="ctx-sdk">—</span></div>
    <div class="ctx-cell"><span class="lbl">Собрано</span><span class="ctx-v" id="ctx-fresh">—</span></div>
    <div class="ctx-cell grow"><span class="lbl">Хранение</span><span class="ctx-v" id="ctx-keep">свой сервер</span></div>
    <div class="ctx-cell">
      <span class="switch" id="rawSwitch" role="switch" aria-checked="false" tabindex="0">
        <span class="track"><span class="knob"></span></span>
        <span style="font-size:12.5px">Ключи из кода</span>
      </span>
    </div>
  </div>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>

  <div class="foot">
    <span id="foot-src">Данные с этого сервера</span>
    <span id="foot-updated"></span>
  </div>
</div>

<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script src="draw.js"></script>
<script src="blocks.js"></script>
<script src="core-views.js"></script>
<script src="panel.js"></script>
</body>
</html>
