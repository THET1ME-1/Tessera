<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tessera</title>
<link rel="preload" href="fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="panel.css">
</head>
<body>

<!-- Вход. Показывается, пока сервер не признал куку. -->
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm">
    <span class="org"><span class="logo"><i></i><i></i><i></i><i></i></span><b>Tessera</b></span>
    <label class="lbl" for="pass">Пароль панели</label>
    <input id="pass" type="password" autocomplete="current-password" autofocus>
    <button class="btn dark" type="submit">Войти</button>
    <p class="gate-note" id="gateNote"></p>
  </form>
</div>

<!-- Панель: боковое меню и карточки справа. -->
<div class="app" id="root" hidden>
  <aside class="side">
    <button class="org" id="org" type="button" aria-haspopup="menu" aria-expanded="false">
      <span class="logo"><i></i><i></i><i></i><i></i></span>
      <b id="org-name">Tessera</b>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m7 9 5-5 5 5M7 15l5 5 5-5"/></svg>
    </button>
    <div class="org-menu" id="org-menu" role="menu" hidden></div>
    <div class="navs">
      <div class="sect"><span>Меню</span></div>
      <nav class="nav" id="nav-core" aria-label="Вкладки ядра"></nav>
      <div class="sect" id="sect-mods" hidden><span>Модули</span></div>
      <nav class="nav" id="nav-mods" aria-label="Вкладки модулей"></nav>
    </div>
    <div class="side-foot">
      <div class="theme" role="group" aria-label="Тема">
        <button data-theme-set="auto" aria-pressed="true">Авто</button><button data-theme-set="light" aria-pressed="false">Светлая</button><button data-theme-set="dark" aria-pressed="false">Тёмная</button>
      </div>
      <div class="me">
        <span class="av">T</span>
        <span class="who"><b>Свой сервер</b><small id="ctx-fresh">данные собираются</small></span>
        <button class="ico" id="refresh" type="button" title="Пересобрать данные" aria-label="Пересобрать данные">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4.5V11h-6.5"/></svg>
        </button>
        <button class="ico" id="signout" type="button" title="Выйти" aria-label="Выйти">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5h4.5v15H14"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg>
        </button>
      </div>
    </div>
  </aside>
  <main class="main"><div class="main-in" id="view"></div></main>
</div>

<div class="tip" id="tip" role="status" aria-live="polite"></div>

<button class="наверх" id="наверх" type="button" aria-label="Наверх" title="Наверх">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
</button>

<script src="draw.js"></script>
<script src="kit.js"></script>
<script src="motion.js"></script>
<script src="blocks.js"></script>
<script src="core-views.js"></script>
<script src="panel.js"></script>
</body>
</html>
